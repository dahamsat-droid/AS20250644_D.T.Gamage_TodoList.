<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar bg-primary" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">My To-Do List</a>
        </div>
    </nav>

    <main>
        <!-- Heading -->
        <section class="container text-center py-4">
            <h1 class="display-5">Tasks Manager</h1>
            <p class="lead">Organize your tasks, Be the best version of yourself in the university</p>
        </section>

        <!-- Task input -->
        <section class="container pb-3">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." aria-label="New task">
                        <button id="addBtn" class="btn btn-primary" type="button">Add Task</button>
                    </div>
                    <p id="errorMessage" class="text-danger small mt-2 mb-0 d-none" role="alert">Please enter a task. Spaces only are not allowed.</p>
                </div>
            </div>
        </section>

        <!-- Task area  -->
        <section class="container pb-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                        <div class="btn-group" role="group" aria-label="Filter tasks">
                            <button type="button" class="btn btn-outline-primary active" data-filter="all">All</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="active">Active</button>
                            <button type="button" class="btn btn-outline-primary" data-filter="completed">Completed</button>
                        </div>
                        <span id="taskCounter" class="text-muted">0 tasks left</span>
                    </div>

                    <ul id="taskList" class="list-group mb-3">
                    </ul>

                    <button id="clearBtn" class="btn btn-danger" type="button">Clear Completed</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
